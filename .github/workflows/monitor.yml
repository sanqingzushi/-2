name: Cloud market checks
on:
  # Manual backup. The production collector now runs on Cloudflare every minute.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    # Deployment-button copies must not duplicate the original repository's backup collector.
    if: github.repository == 'sanqingzushi/-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Read previous cloud snapshot
        run: |
          if git fetch origin monitor-data --depth=1; then
            git show origin/monitor-data:latest.json > data/previous.json
          fi
      - name: Collect source observations
        env:
          PREVIOUS_SNAPSHOT: data/previous.json
        run: node scripts/collect.mjs
      - name: Publish data branch without rebuilding Pages
        run: bash scripts/publish-data.sh
